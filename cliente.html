<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Cliente - Agenda de Medidas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text">

    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center py-4">
            <h1 id="form-title" class="text-3xl font-bold text-primary-blue dark:text-primary-lilas">Adicionar Novo Cliente</h1>
            <div>
                <button id="theme-toggle" class="py-2 px-4 rounded bg-gray-200 dark:bg-gray-700 mr-4">Mudar Tema</button>
                <a href="index.html" class="text-primary-blue dark:text-primary-lilas hover:underline">Voltar à Lista</a>
            </div>
        </header>

        <main class="mt-8 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h2 class="text-xl font-bold mb-4">Informações do Cliente</h2>
                    <div class="mb-4">
                        <label for="clientName" class="block font-medium">Nome do Cliente</label>
                        <input type="text" id="clientName" class="w-full p-2 border rounded mt-1 bg-gray-50 dark:bg-gray-700">
                    </div>
                </div>
                <div>
                    <!-- Pode adicionar mais campos de info aqui, como email, telefone, etc. -->
                </div>
            </div>

            <hr class="my-6">

            <h2 class="text-xl font-bold mb-4">Medidas (em cm)</h2>
            <div id="measurements-form" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Os campos de medidas serão inseridos aqui para consistência -->
                <div class="mb-4">
                    <label for="neck" class="block">Pescoço</label>
                    <input type="number" id="neck" class="w-full p-2 border rounded mt-1 bg-gray-50 dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label for="bust" class="block">Busto</label>
                    <input type="number" id="bust" class="w-full p-2 border rounded mt-1 bg-gray-50 dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label for="waist" class="block">Cintura</label>
                    <input type="number" id="waist" class="w-full p-2 border rounded mt-1 bg-gray-50 dark:bg-gray-700">
                </div>
                <div class="mb-4">
                    <label for="hips" class="block">Quadril</label>
                    <input type="number" id="hips" class="w-full p-2 border rounded mt-1 bg-gray-50 dark:bg-gray-700">
                </div>
                <!-- Adicionar mais campos conforme necessário -->
            </div>

            <div class="flex justify-end space-x-4 mt-8">
                <button id="deleteClientBtn" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded hidden">
                    Apagar Cliente
                </button>
                <button id="saveClientBtn" class="bg-primary-blue hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Salvar Cliente
                </button>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

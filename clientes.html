<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costureira Sula - Gestão de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .clients-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--color-border);
        }
        
        .page-title {
            color: var(--color-primary);
            margin: 0;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius-sm);
            transition: background-color 0.2s;
        }
        
        .back-button:hover {
            background-color: var(--color-primary-dark);
        }
        
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .client-card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-md);
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .client-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .client-name {
            font-size: 1.2rem;
            color: var(--color-primary);
            margin: 0 0 10px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }
        
        .client-detail {
            display: flex;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .client-detail-label {
            font-weight: 600;
            color: var(--color-text);
            min-width: 120px;
        }
        
        .client-detail-value {
            color: var(--color-text-secondary);
        }
        
        .client-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--color-border);
        }
        
        .btn-edit {
            background-color: var(--color-primary);
            color: white;
        }
        
        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        
        .no-clients {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-secondary);
            grid-column: 1 / -1;
        }
        
        .add-client-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        
        .add-client-btn:hover {
            background-color: var(--color-primary-dark);
        }
        
        .search-bar {
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 15px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-sm);
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Gestão de Clientes</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <div class="clients-container">
            <div class="page-header">
                <a href="index.html" class="back-button">
                    <i class="fas fa-arrow-left"></i>
                    Voltar para Medidas
                </a>
                <button class="add-client-btn" id="add-client-btn">
                    <i class="fas fa-plus"></i>
                    Adicionar Cliente
                </button>
            </div>
            
            <div class="search-bar">
                <input type="text" id="client-search" class="search-input" placeholder="Buscar clientes...">
            </div>
            
            <div class="clients-grid" id="clients-grid">
                <!-- Client cards will be added here by JavaScript -->
                <div class="no-clients" id="no-clients">
                    <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                    <h3>Nenhum cliente cadastrado</h3>
                    <p>Clique em "Adicionar Cliente" para começar</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Form Modal -->
    <div class="modal" id="client-form-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Cliente</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="client-form">
                    <input type="hidden" id="client-id">
                    <div class="form-group">
                        <label for="client-name" class="form-label">Nome do Cliente</label>
                        <input type="text" id="client-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="client-phone" class="form-label">Telefone</label>
                        <input type="tel" id="client-phone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="client-email" class="form-label">E-mail</label>
                        <input type="email" id="client-email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="client-notes" class="form-label">Observações</label>
                        <textarea id="client-notes" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="cancel-client">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/clients.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Moldes - Costureira Sula</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <main class="container mx-auto p-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">Perfis de Medidas</h2>
                        <div>
                            <select id="profileSelector" class="p-2 border rounded">
                                <option>Selecione um perfil</option>
                            </select>
                            <button id="deleteProfileBtn" class="bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600 ml-2">Deletar</button>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold mb-4">Medidas</h2>
                    <p class="text-gray-600 mb-4">Dê um nome ao seu perfil de medidas para identificá-lo mais tarde.</p>
                    <div class="mb-4">
                        <label for="profileName" class="block text-gray-700">Nome do Perfil</label>
                        <input type="text" id="profileName" class="w-full p-2 border rounded mt-1">
                    </div>
                    <p class="text-gray-600 mb-4">Insira suas medidas corporais em centímetros.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="neck" class="block text-gray-700">Pescoço</label>
                            <input type="number" id="neck" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="shoulder" class="block text-gray-700">Ombro</label>
                            <input type="number" id="shoulder" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="chest" class="block text-gray-700">Tórax</label>
                            <input type="number" id="chest" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="backWidth" class="block text-gray-700">Largura das Costas</label>
                            <input type="number" id="backWidth" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="armscyeDepth" class="block text-gray-700">Profundidade da Cava</label>
                            <input type="number" id="armscyeDepth" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="sideNeckPointToBustApex" class="block text-gray-700">Do Pescoço ao Ápice do Busto</label>
                            <input type="number" id="sideNeckPointToBustApex" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="bust" class="block text-gray-700">Busto</label>
                            <input type="number" id="bust" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="ribCage" class="block text-gray-700">Caixa Torácica</label>
                            <input type="number" id="ribCage" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="bustSpan" class="block text-gray-700">Distância do Busto</label>
                            <input type="number" id="bustSpan" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="waist" class="block text-gray-700">Cintura</label>
                            <input type="number" id="waist" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="frontSideNeckPointToWaist" class="block text-gray-700">Frente: Do Pescoço à Cintura</label>
                            <input type="number" id="frontSideNeckPointToWaist" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="backSideNeckPointToWaist" class="block text-gray-700">Costas: Do Pescoço à Cintura</label>
                            <input type="number" id="backSideNeckPointToWaist" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="hip" class="block text-gray-700">Quadril</label>
                            <input type="number" id="hip" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="topHip" class="block text-gray-700">Quadril Superior</label>
                            <input type="number" id="topHip" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="waistToHip" class="block text-gray-700">Da Cintura ao Quadril</label>
                            <input type="number" id="waistToHip" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="topArm" class="block text-gray-700">Braço Superior</label>
                            <input type="number" id="topArm" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="wrist" class="block text-gray-700">Pulso</label>
                            <input type="number" id="wrist" class="w-full p-2 border rounded mt-1">
                        </div>
                        <div>
                            <label for="sleeveLength" class="block text-gray-700">Comprimento da Manga</label>
                            <input type="number" id="sleeveLength" class="w-full p-2 border rounded mt-1">
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-bold mb-4">Folga</h2>
                    <p class="text-gray-600 mb-4">Adicione folga adicional às suas medidas básicas do bloco.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="armholeDepthEase" class="block text-gray-700">Folga da Profundidade da Cava</label>
                            <input type="number" id="armholeDepthEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                        <div>
                            <label for="bustEase" class="block text-gray-700">Folga do Busto</label>
                            <input type="number" id="bustEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                        <div>
                            <label for="waistEase" class="block text-gray-700">Folga da Cintura</label>
                            <input type="number" id="waistEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                        <div>
                            <label for="hipEase" class="block text-gray-700">Folga do Quadril</label>
                            <input type="number" id="hipEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                        <div>
                            <label for="topArmEase" class="block text-gray-700">Folga do Braço Superior</label>
                            <input type="number" id="topArmEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                        <div>
                            <label for="sleeveCapEase" class="block text-gray-700">Folga da Cabeça da Manga</label>
                            <input type="number" id="sleeveCapEase" class="w-full p-2 border rounded mt-1" value="1.5">
                        </div>
                        <div>
                            <label for="wristEase" class="block text-gray-700">Folga do Pulso</label>
                            <input type="number" id="wristEase" class="w-full p-2 border rounded mt-1" value="0">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mt-6">
                    <button id="saveProfileBtn" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700" onclick="generateAndDisplayPattern()">Salvar Perfil e Continuar</button>
                </div>
            </div>

            <div class="md:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-bold mb-4">Pré-visualização do Molde</h2>
                    <div id="patternPreview" class="border-2 border-dashed border-gray-300 min-h-[400px]">
                        <!-- SVG will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@freesewing/core/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@freesewing/patterns/dist/index.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

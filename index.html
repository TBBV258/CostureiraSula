<!DOCTYPE html>
<html lang="pt-BR" class="light"> <!-- Default to light mode -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Medidas - Costureira Sula</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text">

    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center py-4">
            <h1 class="text-3xl font-bold text-primary-blue dark:text-primary-lilas">Agenda de Clientes</h1>
            <button id="theme-toggle" class="py-2 px-4 rounded bg-gray-200 dark:bg-gray-700">Mudar Tema</button>
        </header>

        <main class="mt-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl">Meus Clientes</h2>
                <a href="cliente.html" class="bg-primary-blue hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    + Adicionar Novo Cliente
                </a>
            </div>

            <div id="client-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- A lista de clientes será inserida aqui pelo JavaScript -->
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
